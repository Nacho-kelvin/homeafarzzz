<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeAFar | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="contact-panel">
        <div class="visual-block">
          <div class="food-card">
            <img
              src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=80"
              alt="A plated African-inspired meal"
            />
          </div>
          <div class="arrow-graphic" aria-hidden="true">
            <span class="arrow-inner"></span>
          </div>
        </div>

        <div class="content-block">
          <p class="eyebrow">Contact us</p>
          <h1>Tell us about your next African story.</h1>
          <p class="intro">
            We curate cultural experiences, editorial features, and immersive journeys
            across the continent. Share your vision and we’ll help shape it.
          </p>

          <form class="contact-form">
            <div class="field-row">
              <label>
                <span>Name</span>
                <input type="text" placeholder="Your name" />
              </label>
              <label>
                <span>Email</span>
                <input type="email" placeholder="you@example.com" />
              </label>
            </div>

            <label>
              <span>Subject</span>
              <input type="text" placeholder="How can we help?" />
            </label>

            <label>
              <span>Message</span>
              <textarea rows="5" placeholder="Tell us more about your idea..."></textarea>
            </label>

            <button type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
